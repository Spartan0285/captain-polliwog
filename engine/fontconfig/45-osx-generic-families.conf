<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Generic family aliases for Mac OS X.

  Fontconfig's own 60-latin.conf prefers DejaVu, Bitstream Vera and Liberation,
  none of which a Mac has. When every name in its list is missing, fontconfig
  falls through to whatever the scan turned up first, and on a stock 10.4 or
  10.5 system that is Hiragino Maru Gothic: a Japanese face, returned for
  serif, and for sans-serif, and for monospace, to a reader who asked for
  nothing at all. This file is numbered below 60 so that its preferences are
  consulted first.

  No double hyphen anywhere in this comment. XML forbids it, fontconfig
  rejects the whole file when it finds one, and the only sign is one error
  line before it carries on with the defaults.

  The families are listed in the order a Mac user would expect them, with the
  Tiger name after the Leopard one where they differ, and a last entry that is
  on every system going back to 10.0.
-->
<fontconfig>

  <alias>
    <family>serif</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Times</family>
      <family>Georgia</family>
      <family>Palatino</family>
      <family>Lucida Bright</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Helvetica Neue</family>
      <family>Helvetica</family>
      <family>Arial</family>
      <family>Verdana</family>
      <family>Lucida Grande</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <prefer>
      <family>Menlo</family>
      <family>Monaco</family>
      <family>Courier New</family>
      <family>Courier</family>
      <family>Andale Mono</family>
    </prefer>
  </alias>

  <alias>
    <family>cursive</family>
    <prefer>
      <family>Apple Chancery</family>
      <family>Zapfino</family>
    </prefer>
  </alias>

  <alias>
    <family>fantasy</family>
    <prefer>
      <family>Papyrus</family>
      <family>Herculanum</family>
      <family>American Typewriter</family>
    </prefer>
  </alias>

</fontconfig>
